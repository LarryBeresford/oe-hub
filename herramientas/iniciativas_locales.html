<body>
<div class="hdr"><div class="logo">MELI</div><div class="hdr-title" data-i18n="title">Iniciativas Locales</div><div class="hdr-sub" data-i18n="sub">Registro y seguimiento · OE MLM</div></div>
<div class="tabbar noprint">
  <button class="tab on" onclick="sw('registrar',this)" data-i18n="tabReg">Registrar</button>
  <button class="tab" onclick="sw('dash',this)" data-i18n="tabDash">Dashboard</button>
  <button class="tab" onclick="sw('reporte',this)" data-i18n="tabRep">Reporte</button>
</div>

<!-- REGISTRAR -->
<div class="panel on" id="p-registrar">
 <div class="card">
  <form id="regForm" onsubmit="return submitReg(event)">
   <span class="sec" data-i18n="s1">1) Identificación general</span>
   <div class="f2"><div><label data-i18n="fNombre">Nombre de la iniciativa</label><input name="nombre" required></div><div><label data-i18n="fOwner">Owner</label><input name="owner" required></div></div>
   <div class="f3"><div><label data-i18n="fLider">Líder / sponsor</label><input name="lider"></div>
     <div><label data-i18n="fPais">País</label><select name="pais"><option>México</option><option>Brasil</option><option>Argentina</option><option>Chile</option><option>Colombia</option></select></div>
     <div><label data-i18n="fSitio">Sitio</label><input name="sitio" placeholder="SMX10" required></div></div>
   <div class="f3"><div><label data-i18n="fFocal">Focal CIE que registra</label><input name="focal"></div><div><label data-i18n="fEq">Equipo</label><select name="equipo"><option>FM+XD+SC</option><option>SVC+LM</option><option>Gestión</option><option>Otro</option></select></div><div><label data-i18n="fTipoIni">Tipo de iniciativa</label><select name="tipo_iniciativa"><option>Proyecto</option><option>Cambio en WI</option></select></div></div>
   <div class="f2"><div><label data-i18n="fTech">¿Mejora tech o no tech?</label><select name="tech"><option value="Tech">Tech</option><option value="No tech">No tech</option></select></div>
     <div><label data-i18n="fTipo">¿Mejora continua o cambio estructural?</label><select name="tipo_mejora"><option>Mejora continua</option><option>Cambio estructural</option></select></div></div>
   <span class="sec" data-i18n="s2">2) Problema y contexto operacional</span>
   <label data-i18n="fProb">Descripción del problema y diferencias con el proceso actual</label><textarea name="problema" rows="3"></textarea>
   <label data-i18n="fCtx">Contexto (¿por qué?)</label><textarea name="contexto" rows="2"></textarea>
   <div class="f2"><div><label data-i18n="fFac">Tipo de facility / proceso</label><select name="facility"><option>Service Center</option><option>Cross Dock</option><option>Last Mile</option></select></div>
     <div><label data-i18n="fWow">¿Sigue el estándar WOW?</label><select name="estandar_wow"><option value="Sí">Sí</option><option value="No">No</option></select></div></div>
   <span class="sec" data-i18n="s3">3) Impacto y alcance regional</span>
   <div class="f3"><div><label data-i18n="fOkr">OKR de negocio impactado</label><select name="okr"><option>Profitability</option><option>Scalability</option><option>Experience</option><option>New Business</option></select></div>
     <div><label data-i18n="fKpi">KPI impactado</label><select name="kpi"><option>BPP Lost</option><option>Delay</option><option>Productividad</option><option>Safety</option></select></div>
     <div><label data-i18n="fVal">Valor del beneficio</label><input name="valor" type="number" step="any"></div></div>
   <label data-i18n="fBen">Beneficios cuantitativos (KPI, impacto)</label><textarea name="beneficios" rows="2"></textarea>
   <div class="f2"><div><label data-i18n="fAlc">Alcance</label><select name="alcance"><option value="Local">Local</option><option value="Regional">Regional</option></select></div>
     <div><label data-i18n="fPrio">Prioridad</label><select name="prioridad"><option>Must</option><option>Should</option><option>Nice to have</option><option>No priorizada</option></select></div></div>
   <span class="sec" data-i18n="s4">4) Propuesta y documentación</span>
   <label data-i18n="fProp">Propuesta de mejora (opcional)</label><textarea name="propuesta" rows="2"></textarea>
   <label data-i18n="fLink">Links complementarios (one page, tableros, videos)</label><input name="link">
   <button class="btn" type="submit" data-i18n="send">Enviar iniciativa</button>
   <div class="msg" id="regMsg"></div>
  </form>
 </div>
</div>

<!-- DASHBOARD -->
<div class="panel" id="p-dash">
 <div class="demo" id="demoBar"></div>
 <div id="loadMsg" data-i18n="loading">Cargando datos…</div>
 <div id="errMsg" class="msg err"></div>
 <div id="dashBody" style="display:none">
  <div class="flt">
   <select id="fSite" onchange="render()"></select><select id="fPais" onchange="render()"></select><select id="fYear" onchange="render()"></select><select id="fQ" onchange="render()"></select><select id="fEq" onchange="render()"></select>
   <span class="pill" id="updPill"></span>
  </div>
  <div id="dashContent"></div>
  <button class="btn" onclick="sw('reporte')" data-i18n="genRep">Generar reporte de lo filtrado →</button>
 </div>
</div>

<!-- REPORTE -->
<div class="panel" id="p-reporte">
 <div class="noprint" style="margin-bottom:10px"><button class="btn" style="margin:0" onclick="window.print()" data-i18n="print">Imprimir / Guardar como PDF</button>
 <span class="note" data-i18n="printHint" style="margin-left:8px">En el diálogo de impresión elige «Guardar como PDF» y activa «Gráficos de fondo».</span></div>
 <div id="repContent"></div>
</div>

function sw(id, btn){
  document.querySelectorAll('.panel').forEach(function(p){ p.classList.remove('on'); });
  document.getElementById('p-' + id).classList.add('on');
  var map = {registrar:0, dash:1, reporte:2};
  document.querySelectorAll('.tab').forEach(function(b, i){ b.classList.toggle('on', i === map[id]); });
  window.scrollTo(0, 0);
  if(id === 'reporte') fitSlides();
}

// ── REGISTRO ────────────────────────────────────────────────────
function showMsg(cls, txt){ var m = document.getElementById('regMsg'); m.className = 'msg ' + cls; m.textContent = txt; m.style.display = 'block'; }
function submitReg(ev){
  ev.preventDefault();
  var form = document.getElementById('regForm');
  if(!APPS_SCRIPT_URL){ showMsg('warn', t('demoSent')); return false; }
  // Patrón de iframe oculto (igual que "Ideas y sugerencias"): evita CORS y no requiere API key.
  var name = 'hiddenSend' + Date.now();
  var fr = document.createElement('iframe'); fr.name = name; fr.style.display = 'none';
  var f2 = document.createElement('form'); f2.method = 'POST'; f2.action = APPS_SCRIPT_URL; f2.target = name; f2.style.display = 'none';
  new FormData(form).forEach(function(v, k){ var i = document.createElement('input'); i.type = 'hidden'; i.name = k; i.value = v; f2.appendChild(i); });
  document.body.appendChild(fr); document.body.appendChild(f2);
  var done = false;
  fr.onload = function(){ if(done) return; done = true; showMsg('ok', t('okSent')); form.reset(); setTimeout(function(){ fr.remove(); f2.remove(); }, 500); };
  setTimeout(function(){ if(!done){ done = true; showMsg('err', t('sendErr')); } }, 15000);
  f2.submit();
  return false;
}

// ── DATOS ───────────────────────────────────────────────────────
function toDate(v){
  if(v === '' || v == null) return null;
  if(v instanceof Date) return v;
  if(typeof v === 'number'){ var d = new Date(Math.round((v - 25569) * 86400 * 1000)); return isNaN(d) ? null : d; }
  var d2 = new Date(String(v)); return isNaN(d2) ? null : d2;
}
function dayDiff(a, b){ return a && b ? Math.round((b - a) / 86400000) : null; }
function avg(arr){ arr = arr.filter(function(x){ return x != null && x >= 0; }); return arr.length ? arr.reduce(function(s, x){ return s + x; }, 0) / arr.length : null; }
function fmt(n){ return n == null ? '—' : (Math.round(n * 10) / 10).toString(); }

fetch(DATA_FILE).then(function(r){
  if(!r.ok) throw new Error('HTTP ' + r.status);
  return r.arrayBuffer();
}).then(function(buf){
  var wb = XLSX.read(new Uint8Array(buf), {type:'array', cellDates:true});
  var ws = wb.Sheets['Iniciativas'];
  if(!ws) throw new Error('No se encontró la pestaña "Iniciativas"');
  D.rows = XLSX.utils.sheet_to_json(ws, {defval:''}).filter(function(r){ return r.nombre; }).map(function(r){
    r._reg = toDate(r.fecha_registro); r._ges = toDate(r.fecha_gestion); r._mesa = toDate(r.fecha_mesa); r._proy = toDate(r.fecha_proyecto);
    r._desp = String(r.estatus).toLowerCase().indexOf('desprioriz') === 0;
    return r;
  });
  var wi = wb.Sheets['Info'];
  if(wi) XLSX.utils.sheet_to_json(wi, {defval:''}).forEach(function(x){ D.info[x.campo] = x.valor; });
  document.getElementById('loadMsg').style.display = 'none';
  document.getElementById('dashBody').style.display = 'block';
  fillFilters(false); render();
}).catch(function(err){
  console.error(err);
  document.getElementById('loadMsg').style.display = 'none';
  var e = document.getElementById('errMsg'); e.style.display = 'block';
  e.textContent = t('errLoad') + ': ' + err.message + '. ' + t('errHelp');
});

function uniq(key){ var s = {}; D.rows.forEach(function(r){ if(r[key] !== '') s[r[key]] = 1; }); return Object.keys(s).sort(); }
function fillFilters(keep){
  var sels = {fSite:['sitio', t('allSites')], fPais:['pais', t('allCountries')], fQ:['trimestre', t('allQuarters')], fEq:['equipo', t('allTeams')]};
  Object.keys(sels).forEach(function(id){
    var el = document.getElementById(id), cur = keep ? el.value : '';
    el.innerHTML = '<option value="">' + sels[id][1] + '</option>' + uniq(sels[id][0]).map(function(v){ return '<option>' + v + '</option>'; }).join('');
    el.value = cur;
  });
  var ye = document.getElementById('fYear'), cy = keep ? ye.value : '';
  var years = {}; D.rows.forEach(function(r){ if(r._reg) years[r._reg.getFullYear()] = 1; });
  ye.innerHTML = '<option value="">' + t('allYears') + '</option>' + Object.keys(years).sort().map(function(y){ return '<option>' + y + '</option>'; }).join('');
  ye.value = cy;
  var pill = document.getElementById('updPill');
  pill.textContent = t('updated') + ' ' + (D.info.actualizado || '—');
  var demo = document.getElementById('demoBar');
  if(String(D.info.demo).toUpperCase() === 'SI'){ demo.style.display = 'block'; demo.textContent = t('demoBanner'); } else demo.style.display = 'none';
}
function filtered(o){
  o = o || {};
  var s = document.getElementById('fSite').value, p = document.getElementById('fPais').value, y = document.getElementById('fYear').value, q = document.getElementById('fQ').value, e = document.getElementById('fEq').value;
  return D.rows.filter(function(r){ return (o.regional || !isReg(r)) && (!s || r.sitio === s) && (!p || r.pais === p) && (!y || (r._reg && String(r._reg.getFullYear()) === y)) && (o.ignoreQ || !q || r.trimestre === q) && (!e || r.equipo === e); });
}

// ── MÉTRICAS ────────────────────────────────────────────────────
function metrics(rows){
  var m = {n: rows.length};
  m.s1 = rows.length;
  m.s2 = rows.filter(function(r){ return r._ges || r._mesa || r._proy; }).length;
  m.s3 = rows.filter(function(r){ return r._mesa || r._proy; }).length;
  m.s4 = rows.filter(function(r){ return r._proy; }).length;
  m.desp = rows.filter(function(r){ return r._desp; }).length;
  m.apr = (m.s4 + m.desp) ? Math.round(100 * m.s4 / (m.s4 + m.desp)) : null;
  m.t12 = avg(rows.map(function(r){ return dayDiff(r._reg, r._ges); }));
  m.t23 = avg(rows.map(function(r){ return dayDiff(r._ges, r._mesa); }));
  m.t34 = avg(rows.map(function(r){ return dayDiff(r._mesa, r._proy); }));
  m.total = avg(rows.map(function(r){ return dayDiff(r._reg, r._proy); }));
  m.reg = rows.filter(function(r){ return String(r.alcance).toLowerCase() === 'regional'; }).length;
  m.okr = count(rows, 'okr'); m.prio = count(rows, 'prioridad'); m.tech = count(rows, 'tech'); m.alc = count(rows, 'alcance');
  var times = [['t12', m.t12], ['t23', m.t23], ['t34', m.t34]].filter(function(x){ return x[1] != null; });
  m.bott = times.length ? times.sort(function(a, b){ return b[1] - a[1]; })[0] : null;
  return m;
}
function count(rows, key){ var o = {}; rows.forEach(function(r){ var v = r[key] || '—'; o[v] = (o[v] || 0) + 1; }); return Object.keys(o).map(function(k){ return [k, o[k]]; }).sort(function(a, b){ return b[1] - a[1]; }); }
function bars(list, total, color){
  if(!list.length) return '<div class="note">' + t('none') + '</div>';
  var mx = Math.max.apply(null, list.map(function(x){ return x[1]; })) || 1;
  return list.map(function(x){ return '<div class="bar"><em>' + x[0] + '</em><div class="track"><i style="width:' + (100 * x[1] / mx) + '%;' + (color ? 'background:' + color : '') + '"></i></div><s>' + x[1] + '</s></div>'; }).join('');
}
function funnel(m){ return '<div class="fun"><div><b>' + m.s1 + '</b>' + t('st1') + '</div><div><b>' + m.s2 + '</b>' + t('st2') + '</div><div><b>' + m.s3 + '</b>' + t('st3') + '</div><div><b>' + m.s4 + '</b>' + t('st4') + '</div></div>'; }
function timesBars(m){
  var l = [[t('t12'), m.t12], [t('t23'), m.t23], [t('t34'), m.t34]];
  var mx = Math.max.apply(null, l.map(function(x){ return x[1] || 0; })) || 1;
  return l.map(function(x, i){
    var hot = m.bott && m.bott[0] === ['t12', 't23', 't34'][i];
    return '<div class="bar"><em style="min-width:150px">' + x[0] + '</em><div class="track"><i style="width:' + (100 * (x[1] || 0) / mx) + '%;' + (hot ? 'background:#E24B4A' : '') + '"></i></div><s>' + fmt(x[1]) + '</s></div>';
  }).join('');
}
function bottleneckText(m){ return m.bott ? t('bottleneck') + ' ' + t(m.bott[0]) + ' (' + fmt(m.bott[1]) + ' d)' : ''; }

function render(){
  var rows = filtered({}), m = metrics(rows);
  document.getElementById('dashContent').innerHTML =
   '<div class="kpis">' +
    '<div class="kpi"><b>' + m.n + '</b><span>' + t('kTotal') + '</span></div>' +
    '<div class="kpi"><b>' + (m.apr == null ? '—' : m.apr + '%') + '</b><span>' + t('kApr') + '</span></div>' +
    '<div class="kpi"><b>' + fmt(m.total) + '</b><span>' + t('kDays') + '</span></div>' +
    '<div class="kpi"><b>' + m.reg + '</b><span>' + t('kReg') + '</span></div></div>' +
   '<div class="card"><h3>' + t('hFunnel') + '</h3>' + funnel(m) + '<div class="note">' + t('hDesp') + ': ' + m.desp + '</div></div>' +
   '<div class="g2"><div class="card"><h3>' + t('hOkr') + '</h3>' + bars(m.okr) + '</div>' +
   '<div class="card"><h3>' + t('hPrio') + '</h3>' + bars(m.prio) + '<div class="note">' + t('tech') + ' ' + pct(m.tech, 'Tech', m.n) + ' · ' + t('notech') + ' ' + pct(m.tech, 'No tech', m.n) + ' · ' + t('local') + ' ' + pct(m.alc, 'Local', m.n) + ' · ' + t('regional') + ' ' + pct(m.alc, 'Regional', m.n) + '</div></div></div>' +
   '<div class="card"><h3>' + t('hTimes') + '</h3>' + timesBars(m) + '<div class="note">' + bottleneckText(m) + '</div></div>';
  renderReport();
}
function pct(list, key, n){ var f = list.filter(function(x){ return x[0] === key; })[0]; return n && f ? Math.round(100 * f[1] / n) + '%' : '0%'; }

// ── REPORTE tipo "Reporte Portafolio de Proyectos" (estructura del deck de Mónica) ──
var ESTS = [['Done','#FFD001'],['Carry on Q4','#F59E0B'],['On hold','#1A1A1A'],['Q1 2027','#9CA3AF'],['Backlog','#D9D9D9'],['Cancelado','#6B6B6B']];
var EQUIPOS = ['FM+XD+SC','SVC+LM','Gestión','Otro'];
function esc(x){ return String(x == null ? '' : x).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function ek(r){ var v = String(r.estatus_ejec || '').trim() || 'Backlog'; var f = ESTS.filter(function(x){ return x[0].toLowerCase() === v.toLowerCase(); })[0]; return f ? f[0] : v; }
function eqOf(r){ return String(r.equipo || '').trim() || 'Otro'; }
function isReg(r){ return String(r.ambito || '').toLowerCase() === 'regional'; }
function orderedEquipos(rows){ var s = {}; rows.forEach(function(r){ s[eqOf(r)] = 1; }); var out = EQUIPOS.filter(function(e){ return s[e]; }); Object.keys(s).forEach(function(e){ if(out.indexOf(e) < 0) out.push(e); }); return out; }
function groupCount(rows, fn){ var o = {}; rows.forEach(function(r){ var k = fn(r); o[k] = (o[k] || 0) + 1; }); return o; }
function pc(a, n){ return n ? Math.round(100 * a / n) : 0; }
function tf(key, o){ return t(key).replace(/\{(\w+)\}/g, function(_, k){ return o[k] != null ? o[k] : ''; }); }
function clip(s, n){ s = String(s || '').trim(); return s.length > n ? s.slice(0, n - 1) + '…' : s; }
function donutSeg(segs, size){
  var tot = segs.reduce(function(s, x){ return s + x.val; }, 0) || 1, acc = 0, parts = [];
  segs.forEach(function(x){ if(!x.val) return; var a = acc / tot * 100; acc += x.val; parts.push(x.color + ' ' + a + '% ' + (acc / tot * 100) + '%'); });
  var bg = parts.length ? 'conic-gradient(' + parts.join(',') + ')' : '#e5e5e5';
  var lg = segs.filter(function(x){ return x.val; }).map(function(x){ return '<div><span class="dt" style="background:' + x.color + '"></span>' + esc(x.label) + ' <b>' + pc(x.val, tot) + '%</b> <span style="color:#767676">(' + x.val + ')</span></div>'; }).join('');
  return '<div class="dn2"><div class="ring" style="width:' + size + 'px;height:' + size + 'px;background:' + bg + '"></div><div class="lg2">' + lg + '</div></div>';
}
function estSegs(rows){ var g = groupCount(rows, ek); return ESTS.map(function(x){ return {label: x[0], val: g[x[0]] || 0, color: x[1]}; }); }
function stackedByEquipo(rows){
  var h = '';
  orderedEquipos(rows).forEach(function(e){
    var rr = rows.filter(function(r){ return eqOf(r) === e; }), n = rr.length, g = groupCount(rr, ek);
    h += '<div class="sb"><em>' + esc(e) + ' <small>(' + n + ')</small></em><div class="sbt">' + ESTS.filter(function(x){ return g[x[0]]; }).map(function(x){
      var v = g[x[0]], dark = (x[1] === '#1A1A1A' || x[1] === '#6B6B6B');
      return '<i style="width:' + (100 * v / n) + '%;background:' + x[1] + ';color:' + (dark ? '#fff' : '#1A1A1A') + '">' + (v / n >= 0.08 ? v : '') + '</i>';
    }).join('') + '</div></div>';
  });
  return h + '<div class="sbl">' + ESTS.map(function(x){ return '<span><span class="dt" style="background:' + x[1] + '"></span>' + x[0] + '</span>'; }).join('') + '</div>';
}
function hlList(items){ return '<ul class="hl" contenteditable="true" spellcheck="false">' + items.map(function(x){ return '<li>' + x + '</li>'; }).join('') + '</ul>'; }
function portfolioHl(rows){
  var n = rows.length, g = groupCount(rows, ek), done = g['Done'] || 0, q4 = g['Carry on Q4'] || 0, bk = (g['Backlog'] || 0) + (g['On hold'] || 0);
  var items = [tf('hlDone', {a: done, n: n, p: pc(done, n)}), tf('hlQ4', {a: q4, n: n, p: pc(q4, n)}), tf('hlBk', {a: bk, n: n, p: pc(bk, n)})];
  orderedEquipos(rows).map(function(e){ var rr = rows.filter(function(r){ return eqOf(r) === e; }); return {e: e, n: rr.length, d: rr.filter(function(r){ return ek(r) === 'Done'; }).length}; })
    .sort(function(a, b){ return b.n - a.n; }).slice(0, 2).forEach(function(x){ items.push(tf('hlEq', {e: esc(x.e), n: x.n, d: x.d, p: pc(x.d, x.n)})); });
  return hlList(items);
}
function qKey(s){ var m = /Q(\d)\s*(\d{4})/i.exec(String(s || '')); return m ? (+m[2]) * 10 + (+m[1]) : 0; }
function latestQ(rows){ var best = '', bk = 0; rows.forEach(function(r){ var k = qKey(r.trimestre); if(k > bk){ bk = k; best = r.trimestre; } }); return best; }
function monthYear(){
  if(D.info.periodo && LANG === 'es') return D.info.periodo;
  return new Date().toLocaleDateString(LANG === 'en' ? 'en-US' : (LANG === 'pt' ? 'pt-BR' : 'es-MX'), {month: 'long', year: 'numeric'}).replace(/^./, function(c){ return c.toUpperCase(); });
}
function shell(cls, title, body, scope){
  return '<div class="sl-box"><div class="sl ' + cls + '"><div class="top"><b>' + t('kicker') + '</b></div><div class="wow">W<i>o</i>W</div>' +
    (title ? '<h2>' + title + '</h2>' : '') + '<div class="body">' + body + '</div><div class="foot"><span>' + esc(scope) + '</span><span>@@N@@ / @@T@@</span></div></div></div>';
}
function formula(total, label, parts){
  return '<div class="fm"><div class="tot"><small>' + label + '</small><b>' + total + '</b></div><div class="op" style="margin:0 -2px">=</div>' +
    parts.map(function(p, i){ return (i ? '<div class="op">+</div>' : '') + '<div class="fk"><small>' + esc(p[0]) + '</small><b>' + p[1] + '</b></div>'; }).join('') + '</div>';
}
function renderReport(){
  var rowsAll = filtered({regional: true}), loc = rowsAll.filter(function(r){ return !isReg(r); }), reg = rowsAll.filter(isReg);
  var flow = filtered({}), m = metrics(flow);
  var site = document.getElementById('fSite').value || t('allSites'), pais = document.getElementById('fPais').value || t('allCountries');
  var qv = document.getElementById('fQ').value, qSel = qv || latestQ(filtered({regional: true, ignoreQ: true}));
  var scope = site + ' · ' + pais + ' · ' + (qv || t('allQuarters')) + (String(D.info.demo).toUpperCase() === 'SI' ? ' · DEMO' : '');
  var S = [];
  // Portada
  S.push('<div class="sl-box"><div class="sl g"><div class="top"><b>' + t('kicker') + '</b></div><div class="wow">W<i>o</i>W</div>' +
    '<div class="cv-kick">' + t('kickerPort') + '</div><div class="cv-title">' + t('cvRep') + '<br><span class="cv-pill" style="font-size:54px">' + esc(monthYear()) + '</span></div>' +
    '<div class="cv-meta">' + esc(scope) + '<br>' + t('updated') + ' ' + esc(D.info.actualizado || '—') + '</div>' +
    '<div class="cv-circle"><b>' + rowsAll.length + '</b><span>' + t('kTotal') + '</span></div></div></div>');
  // Portafolio regional
  if(reg.length){
    var cl = groupCount(reg, function(r){ return String(r.clasificacion || '').trim().toLowerCase(); });
    S.push(shell('t', t('repReg') + ' · ' + esc(qv || t('allQuarters')),
      formula(reg.length, t('totReg'), [[t('clPri'), cl['priorizada'] || 0], [t('clTen'), cl['tentativa'] || 0], [t('clDes'), cl['despriorizada'] || 0]]) +
      '<div class="pn2"><div class="pbox"><h4>' + t('hStatus') + '</h4>' + donutSeg(estSegs(reg), 120) + '</div><div class="pbox"><h4>' + t('hByTeam') + '</h4>' + stackedByEquipo(reg) + '</div></div>' + portfolioHl(reg), scope));
  }
  // Portafolio local
  var eqL = orderedEquipos(loc);
  S.push(shell('t', t('repLoc') + ' · ' + esc(qv || t('allQuarters')),
    formula(loc.length, t('totLoc'), eqL.slice(0, 4).map(function(e){ return [e, loc.filter(function(r){ return eqOf(r) === e; }).length]; })) +
    '<div class="pn2"><div class="pbox"><h4>' + t('hStatus') + '</h4>' + donutSeg(estSegs(loc), 120) + '</div><div class="pbox"><h4>' + t('hByTeam') + '</h4>' + stackedByEquipo(loc) + '</div></div>' + portfolioHl(loc), scope));
  // Generación de iniciativas en el trimestre
  var gen = filtered({regional: true, ignoreQ: true}).filter(function(r){ return !qSel || r.trimestre === qSel; });
  var gt = groupCount(gen, function(r){ return String(r.tipo_iniciativa || 'Proyecto'); }), ge = groupCount(gen, eqOf);
  var gs = groupCount(gen, function(r){ return ek(r); });
  var fo = {}; gen.forEach(function(r){ var f = String(r.focal || r.owner || '').trim(); if(f) fo[f] = (fo[f] || 0) + 1; });
  var top3 = Object.keys(fo).map(function(k){ return [k, fo[k]]; }).sort(function(a, b){ return b[1] - a[1]; }).slice(0, 3);
  var order = top3.length === 3 ? [top3[1], top3[0], top3[2]] : top3, hts = top3.length === 3 ? [110, 150, 80] : [150, 120, 90], cols = top3.length === 3 ? ['#C9C9C9', '#FFD001', '#B08D57'] : ['#FFD001', '#C9C9C9', '#B08D57'];
  var gbars = function(o){ var k = Object.keys(o).sort(function(a, b){ return o[b] - o[a]; }), mx = Math.max.apply(null, k.map(function(x){ return o[x]; })) || 1;
    return k.map(function(x){ return '<div class="rb"><em style="min-width:100px;font-size:14px">' + esc(x) + '</em><div class="tr"><i style="width:' + (100 * o[x] / mx) + '%;background:#1A1A1A"></i></div><s>' + o[x] + '</s></div>'; }).join(''); };
  S.push(shell('t', t('repGen') + ' · ' + esc(qSel || '—'),
    '<div class="gen4"><div class="big-c"><b>' + gen.length + '</b><span>' + t('genN') + '</span></div>' +
    '<div class="pbox"><h4>' + t('hByType') + '</h4>' + donutSeg(Object.keys(gt).map(function(k, i){ return {label: k, val: gt[k], color: i ? '#1A1A1A' : '#FFD001'}; }), 96) + '</div>' +
    '<div class="pbox"><h4>' + t('hByTeam2') + '</h4>' + gbars(ge) + '</div><div class="pbox"><h4>' + t('hByStatus') + '</h4>' + gbars(gs) + '</div></div>' +
    '<div style="margin-top:14px;font-weight:800;font-size:20px">' + t('top3') + ' <span style="font-weight:400;font-size:13px;color:#767676">· ' + t('top3sub') + '</span></div>' +
    '<div class="pod">' + order.map(function(x, i){ return '<div style="height:' + hts[i] + 'px;background:' + cols[i] + '">' + x[1] + '<small>' + esc(x[0]) + '</small></div>'; }).join('') + '</div>', scope));
  // Proyectos locales
  var axSi = loc.filter(function(r){ return String(r.meli_axis || '').toLowerCase().indexOf('s') === 0; }).length, bkl = loc.filter(function(r){ return ek(r) === 'Backlog'; }).length;
  S.push(shell('t', t('repProj') + ' · ' + esc(qv || t('allQuarters')),
    '<div style="display:flex;gap:22px;align-items:flex-start"><div class="big-c"><b>' + loc.length + '</b><span>' + t('projN') + '</span></div>' +
    '<div class="pbox" style="width:300px"><h4>' + t('hAxis') + '</h4>' + donutSeg([{label: t('axYes'), val: axSi, color: '#FFD001'}, {label: t('axNo'), val: loc.length - axSi, color: '#1A1A1A'}], 110) +
    '<div style="font-size:13px;margin-top:10px;color:#444">' + tf('axNote', {a: loc.length - axSi, b: bkl}) + '</div></div>' +
    '<div class="pbox" style="flex:1"><h4>' + t('hByTeam') + '</h4>' + stackedByEquipo(loc) + '</div></div>' + portfolioHl(loc), scope));
  // Principales proyectos
  var cand = loc.filter(function(r){ return String(r.meli_axis || '').toLowerCase().indexOf('s') === 0 && +r.avance > 0; }).sort(function(a, b){ return (+b.avance) - (+a.avance); }).slice(0, 3);
  if(cand.length) S.push(shell('t', t('repMain') + ' ' + esc(qSel || ''),
    '<div class="pr3">' + cand.map(function(r, i){ return '<div class="pcard"><h5>' + (i + 1) + '. ' + esc(r.nombre) + '</h5><div class="own">' + esc(r.focal || r.owner) + ' · ' + esc(r.sitio) + '</div><div class="av">' + t('avance') + ': ' + (+r.avance) + '%</div>' +
      '<p><b>' + t('dolor') + ':</b> ' + esc(clip(r.problema, 210)) + '</p><p style="margin-top:6px"><b>' + t('solucion') + ':</b> ' + esc(clip(r.propuesta, 170)) + '</p><p style="margin-top:6px"><b>' + t('beneficios') + ':</b> ' + esc(clip(r.beneficios, 170)) + '</p></div>'; }).join('') + '</div>', scope));
  // Flujo + tiempos (embudo propio del Hub)
  var st = [[m.s1, 'st1'], [m.s2, 'st2'], [m.s3, 'st3'], [m.s4, 'st4']];
  S.push(shell('y', t('repFlow'), '<div style="position:absolute;inset:0 0 84px 0"><div class="pills">' + st.map(function(x, i){
      var conv = i === 0 ? '' : (st[i - 1][0] ? pc(x[0], st[i - 1][0]) + '% ' + t('ofPrev') : '—');
      return '<div class="pl"><div class="n">0' + (i + 1) + '.</div><div class="tt">' + t(x[1]) + '</div><div class="ct">' + x[0] + '</div><div class="cv">' + conv + '</div></div>'; }).join('') +
    '</div></div><div class="band"><b>' + m.desp + '</b> ' + t('hDesp').toLowerCase() + '</div>', scope));
  var tl = [['t12', m.t12], ['t23', m.t23], ['t34', m.t34]], mx = Math.max.apply(null, tl.map(function(x){ return x[1] || 0; })) || 1, ins = bottleneckText(m);
  S.push(shell('t', t('hTimes'), tl.map(function(x){ var hot = m.bott && m.bott[0] === x[0]; return '<div class="tm"><div class="lb">' + t(x[0]) + '</div><div class="tk"><div class="fl' + (hot ? ' hot' : '') + '" style="width:' + Math.max(12, 100 * (x[1] || 0) / mx) + '%">' + fmt(x[1]) + ' d</div></div></div>'; }).join('') +
    '<div class="insight" style="margin-top:30px">' + (ins || '—') + '</div>', scope));
  var total = S.length;
  document.getElementById('repContent').innerHTML = S.map(function(h, i){ return h.replace('@@N@@', i + 1).replace('@@T@@', total); }).join('');
  fitSlides();
}
function fitSlides(){
  var wrap = document.getElementById('repContent'), w = wrap.clientWidth;
  if(!w) return;
  var s = Math.min(1, w / 1280);
  wrap.querySelectorAll('.sl-box').forEach(function(b){ b.style.width = (1280 * s) + 'px'; b.style.height = (720 * s) + 'px'; b.firstChild.style.transform = 'scale(' + s + ')'; });
}
window.addEventListener('resize', fitSlides);
</script>
