<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boletines OE — Newsletter</title>
<link rel="icon" type="image/svg+xml" href="../media/favicon.svg">
<script src="lib/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#F5F5F5;color:#1A1A1A}

/* HEADER (idéntico patrón "app-bar" de señalética/slides: negro dominante, amarillo
   solo de acento, logo+título+subtítulo en una sola línea con la misma tipografía) */
.hdr{height:52px;display:flex;align-items:center;gap:14px;padding:0 24px;
  background:#000;box-shadow:0 2px 12px rgba(0,0,0,.5);flex-shrink:0;position:relative;z-index:200}
.hdr-l{display:flex;align-items:baseline;gap:14px}
.logo{background:#FFD001;color:#000;font-weight:900;font-size:12px;padding:4px 10px;border-radius:4px;letter-spacing:.5px}
.hdr-title{font-size:14px;font-weight:600;letter-spacing:normal;color:#fff}
.hdr-sub{font-size:11px;color:#999;letter-spacing:normal;text-transform:none;margin-left:4px}

/* TABS */
.tabbar{height:38px;display:flex;align-items:center;padding:0 22px;gap:4px;
  border-bottom:1px solid #E2E2E2;background:#fff;flex-shrink:0}
.tab{padding:6px 16px;border-radius:20px;font-size:10.5px;font-weight:700;cursor:pointer;
  color:#555;background:transparent;border:1.5px solid transparent;transition:all .15s;letter-spacing:.3px;font-family:'Segoe UI',sans-serif}
.tab.on{background:#1A1A1A;color:#FFD001;font-weight:800}
.tab:hover:not(.on){color:#1A1A1A;background:#F0F0F0}

.wrap{max-width:1180px;margin:0 auto;padding:24px 24px 60px}
.panel{display:none}
.panel.on{display:block;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

.section-title{font-size:10.5px;font-weight:800;color:#999;text-transform:uppercase;letter-spacing:1.2px;margin:22px 0 12px}
.section-title:first-child{margin-top:0}

/* ── TARJETAS DE ÁREA: rectángulos anchos apilados (uno por área, en orden
     FirstMile → SVC+Last Mile → Quality → Gestión), no cuadritos en grid.
     Mismo lenguaje visual que .result/.hist-row: borde izquierdo de color +
     icono en insignia tintada, un color distinto por área. ── */
.grid4{display:flex;flex-direction:column;gap:14px;margin-bottom:22px}
.area-card{background:#fff;border:1px solid #ECECEC;border-left:4px solid var(--ac,#FFD001);border-radius:14px;
  padding:20px 24px;box-shadow:0 1px 4px rgba(0,0,0,.045);transition:box-shadow .18s,transform .18s;
  display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.area-card:hover{box-shadow:0 10px 26px rgba(0,0,0,.08);transform:translateY(-1px)}
.area-left{display:flex;align-items:center;gap:14px;min-width:230px}
.area-icon{width:46px;height:46px;border-radius:12px;background:var(--ac-bg,#FFFBEA);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.area-icon svg{width:23px;height:23px;stroke:var(--ac,#FFD001)}
.area-name{font-size:15px;font-weight:800;color:#111;line-height:1.25}
.area-file{font-size:9.5px;color:#aaa;text-transform:uppercase;letter-spacing:.5px;margin-top:2px}

.area-mid{flex:1;min-width:260px}
.area-right{flex-shrink:0}

.dropzone{display:flex;align-items:center;gap:11px;border:1.5px dashed #D8DCE1;border-radius:10px;
  padding:13px 16px;cursor:pointer;transition:all .15s;background:#FAFAFA;position:relative}
.dropzone:hover{border-color:var(--ac,#FFD001);background:var(--ac-bg,#FFFBEA)}
.dropzone.has-file{border-style:solid;border-color:var(--ac,#FFD001);background:var(--ac-bg,#FFFBEA)}
.dropzone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.dz-icon{width:30px;height:30px;border-radius:8px;background:#fff;border:1px solid #E2E2E2;display:flex;align-items:center;
  justify-content:center;flex-shrink:0;font-size:14px}
.dropzone.has-file .dz-icon{background:var(--ac,#FFD001);border-color:var(--ac,#FFD001)}
.dz-text{font-size:11px;color:#888;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dropzone.has-file .dz-text{color:#1A1A1A;font-weight:700}

.kpi-toggle{font-size:9.5px;font-weight:700;color:#999;cursor:pointer;text-transform:uppercase;
  letter-spacing:.5px;user-select:none;display:flex;align-items:center;gap:5px;transition:color .15s;white-space:nowrap}
.kpi-toggle:hover{color:#1A1A1A}
.kpi-toggle .chev{display:inline-block;transition:transform .2s;font-size:8px}
.kpi-toggle.open .chev{transform:rotate(180deg)}
.kpi-box{display:none;flex-basis:100%;margin-top:2px;padding:14px;background:#FAFAFA;border:1px solid #EEE;border-radius:10px}
.kpi-box.on{display:block;animation:fadeIn .18s ease}
.kpi-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.kpi-field{flex:1;min-width:68px}
.kpi-field label{font-size:8px;color:#999;text-transform:uppercase;letter-spacing:.3px;display:block;margin-bottom:3px;font-weight:700}
.kpi-field input{width:100%;font-size:12px;padding:6px 7px;border:1px solid #E2E2E2;border-radius:6px;font-family:'Segoe UI',sans-serif;transition:border-color .15s}
.kpi-field input:focus{outline:none;border-color:var(--ac,#FFD001)}
.kpi-total{font-size:10px;color:#999;margin-top:2px;border-top:1px solid #EEE;padding-top:8px}
.kpi-total b{color:#111;font-size:14px;font-weight:800}

/* BOTONES */
.btn{display:inline-flex;align-items:center;gap:7px;background:#FFD001;color:#111;font:800 11.5px/1 'Segoe UI',sans-serif;
  padding:12px 24px;border-radius:9px;border:none;cursor:pointer;text-transform:uppercase;letter-spacing:.5px;
  transition:transform .12s,box-shadow .12s;box-shadow:0 2px 0 #C9A700}
.btn:hover{transform:translateY(-1px);box-shadow:0 3px 8px rgba(0,0,0,.18)}
.btn:active{transform:translateY(1px);box-shadow:0 1px 0 #C9A700}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn.secondary{background:#1A1A1A;color:#FFD001;box-shadow:0 2px 0 #000}
.btn.small{padding:8px 15px;font-size:9.5px;border-radius:7px;box-shadow:none}
.btn.ghost{background:#fff;color:#1A1A1A;border:1.5px solid #E2E2E2;box-shadow:none}
.btn.ghost:hover{border-color:#1A1A1A;box-shadow:none}

/* ESTADOS VACÍOS */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  color:#B0B0B0;gap:14px;padding:56px 24px;background:#fff;border:1px dashed #E2E2E2;border-radius:14px}
.empty-state .ico{width:52px;height:52px;border-radius:50%;background:#FAFAFA;display:flex;align-items:center;justify-content:center}
.empty-state .ico svg{width:26px;height:26px;stroke:#C4C4C4}
.empty-state .txt{font-size:13px;max-width:420px;line-height:1.65;color:#999}

/* RESULTADOS */
.result{background:#fff;border:1px solid #ECECEC;border-radius:14px;padding:20px 22px;margin-bottom:16px;
  box-shadow:0 1px 4px rgba(0,0,0,.04);border-left:4px solid var(--ac,#FFD001)}
.result-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.result-badge{width:30px;height:30px;border-radius:8px;background:var(--ac-bg,#FFFBEA);display:flex;align-items:center;
  justify-content:center;flex-shrink:0}
.result-badge svg{width:16px;height:16px;stroke:var(--ac,#FFD001)}
.result-title{font-size:14px;font-weight:800;color:#111}
.result-file{font-size:9.5px;color:#aaa;margin-top:1px}

.kbbar-row{display:flex;justify-content:space-between;font-size:10px;color:#999;margin-bottom:5px;font-weight:600}
.kbbar{background:#EEE;border-radius:6px;height:7px;overflow:hidden;margin-bottom:14px}
.kbbar-fill{height:100%;transition:width .3s;border-radius:6px}

details{margin-bottom:8px;border:1px solid #EEE;border-radius:10px;overflow:hidden}
details summary{padding:10px 14px;font-size:11px;font-weight:700;cursor:pointer;background:#FAFAFA;list-style:none;
  display:flex;align-items:center;gap:7px}
details summary::-webkit-details-marker{display:none}
details summary::before{content:'';width:6px;height:6px;border-radius:50%;flex-shrink:0}
details[open] summary{border-bottom:1px solid #EEE}
details .body{padding:12px 16px;font-size:11.5px;color:#666;line-height:1.7;background:#fff}
details .body div{margin-bottom:5px;padding-left:14px;position:relative}
details .body div::before{content:'—';position:absolute;left:0;color:#CCC}
.aviso-orto summary{color:#0369a1}
.aviso-orto summary::before{background:#0ea5e9}
.aviso-lint summary{color:#b45309}
.aviso-lint summary::before{background:#f59e0b}

.preview-mock{border:1px solid #E2E2E2;border-radius:10px;margin-top:14px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.06)}
.preview-bar{display:flex;align-items:center;gap:6px;padding:9px 12px;background:#F0F0F0;border-bottom:1px solid #E2E2E2}
.preview-bar .dot{width:9px;height:9px;border-radius:50%}
.preview-bar .dot:nth-child(1){background:#ff5f57}
.preview-bar .dot:nth-child(2){background:#febc2e}
.preview-bar .dot:nth-child(3){background:#28c840}
.preview-bar .url{margin-left:8px;font-size:9.5px;color:#999;background:#fff;border:1px solid #E2E2E2;border-radius:5px;
  padding:2px 10px;flex:1;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.preview-frame{width:100%;height:600px;border:none;display:block;background:#e9ebee}

/* HISTORIAL */
.hist-row{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid #ECECEC;
  border-radius:12px;padding:14px 18px;margin-bottom:9px;flex-wrap:wrap;border-left:4px solid var(--ac,#FFD001);
  transition:box-shadow .15s}
.hist-row:hover{box-shadow:0 4px 14px rgba(0,0,0,.06)}
.hist-badge{width:30px;height:30px;border-radius:8px;background:var(--ac-bg,#FFFBEA);display:flex;align-items:center;
  justify-content:center;flex-shrink:0}
.hist-badge svg{width:15px;height:15px;stroke:var(--ac,#FFD001)}
.hist-info{font-size:11.5px;color:#888;flex:1;min-width:180px}
.hist-info b{color:#111;font-size:12.5px}
.hist-actions{display:flex;gap:8px;margin-left:auto}
.err-box{background:#FEF2F2;border:1px solid #FECACA;color:#991B1B;border-radius:10px;padding:12px 16px;font-size:11.5px;margin-bottom:10px}

/* ═══ RESPONSIVE (tablet y celular) ═══ */
@media(max-width:820px){
  .wrap{padding:18px 16px 50px}
  .grid4{gap:12px}
}
@media(max-width:640px){
  .hdr{padding:0 14px;gap:10px}
  .hdr-sub{display:none}
  .tabbar{padding:0 14px}
  .wrap{padding:16px 12px 40px}
  .area-card{padding:16px}
  .area-left{min-width:0;flex:1 1 100%}
  .area-mid{min-width:0;flex:1 1 100%}
  .area-right{flex:1 1 100%}
  .kpi-toggle{justify-content:flex-start}
  .preview-frame{height:420px}
  .result{padding:16px}
  .hist-row{padding:12px 14px}
  .hist-actions{margin-left:0;width:100%}
  .hist-actions .btn{flex:1}
}
</style>
</head>
<body>

<!-- ══ HEADER ══ -->
<div class="hdr">
  <div class="hdr-l">
    <div class="logo">MELI</div>
    <div class="hdr-title" data-i18n="hdrTitle">Boletines OE</div>
    <div class="hdr-sub" data-i18n="hdrSub">Newsletter mensual · Excelencia Operativa · México</div>
  </div>
</div>

<!-- ══ TAB BAR ══ -->
<div class="tabbar">
  <button class="tab on" onclick="switchTab('generar',this)" data-i18n="tabGenerar">Generar</button>
  <button class="tab" onclick="switchTab('historial',this)" data-i18n="tabHistorial">Historial</button>
</div>

<div class="wrap">

  <!-- ══ PANEL: GENERAR ══ -->
  <div class="panel on" id="p-generar">
    <div class="section-title" id="sectionUpload" data-i18n="sectionUpload">Sube el Excel de cada área</div>
    <div class="grid4" id="areaCards"></div>
    <button class="btn" id="btnGenerar" onclick="generarTodos()">Generar desde los Excel subidos</button>
    <div id="resultados" style="margin-top:22px"></div>
  </div>

  <!-- ══ PANEL: HISTORIAL ══ -->
  <div class="panel" id="p-historial">
    <div class="section-title" data-i18n="sectionHistorial">Boletines generados (persisten en este navegador)</div>
    <div id="historialList"></div>
  </div>

</div>

<script>
// ---------------------------------------------------------------
// Idiomas (ES/EN/PT) -- se sincroniza con el selector del Hub via
// postMessage {type:'oeHubLang', lang}, igual patrón que usa el Hub
// para Insights de Portafolio. CURRENT_LANG por defecto 'es'.
// ---------------------------------------------------------------
var CURRENT_LANG = 'es';
var I18N = {
  es: {
    hdrTitle: 'Boletines OE',
    hdrSub: 'Newsletter mensual · Excelencia Operativa · México',
    tabGenerar: 'Generar', tabHistorial: 'Historial',

    sectionHistorial: 'Boletines generados (persisten en este navegador)',
    excelDe: 'Excel de {area}',
    dzText: 'Arrastra tu Excel aquí o haz clic para elegir',
    kpiToggle: 'Resumen de proyectos de {area} (opcional)',
    kpiTotal: 'Proyectos (total, calculado)',
    btnDefault: 'Generar desde los Excel subidos',
    btnAll: 'Generar los {n} boletines a la vez',
    btnSome: 'Generar {n} de {total} boletines subidos',
    emptyGenerar: 'Sube al menos un Excel para generar su boletín.',
    emptyHistorial: 'Todavía no has generado ningún boletín. Los que generes van a aparecer aquí para volver a descargarlos sin regenerarlos.',
    borrarHistorial: 'Borrar historial',
    descargar: 'Descargar',
    vistaPrevia: 'Vista previa',
    ocultarPrevia: 'Ocultar',
    avisoOrto: '{n} correcciones de ortografía aplicadas',
    avisoLint: '{n} cosas para revisar en el Excel',
    noGenerado: 'no se pudo generar',
    fuenteExcel: 'Excel manual',
    errContacta: 'Revisa el formato del Excel; si el problema sigue, escríbele a <a href="mailto:larry.beresforddiaz@mercadolibre.com.mx" style="color:#991B1B;font-weight:700;">Larry Beresford Díaz</a>.',
    kbOk: 'OK', kbPesado: 'pesado para email'
  },
  en: {
    hdrTitle: 'Newsletter Generator',
    hdrSub: 'Monthly Newsletter · Operational Excellence · Mexico',
    tabGenerar: 'Generate', tabHistorial: 'History',
    sectionUpload: 'Upload each area\'s Excel (same model as always: Config / Proyectos / Secciones / Eventos / NuevosIngresos / KPIs)',
    sectionHistorial: 'Generated newsletters (persist in this browser)',
    excelDe: '{area} Excel',
    dzText: 'Drag your Excel here or click to choose',
    kpiToggle: '{area} Project Summary (optional)',
    kpiTotal: 'Projects (calculated total)',
    btnDefault: 'Generate from uploaded Excel files',
    btnAll: 'Generate all {n} newsletters at once',
    btnSome: 'Generate {n} of {total} uploaded newsletters',
    emptyGenerar: 'Upload at least one Excel file to generate its newsletter.',
    emptyHistorial: 'You haven\'t generated any newsletters yet. The ones you generate will show up here so you can re-download them without regenerating.',
    borrarHistorial: 'Clear history',
    descargar: 'Download',
    vistaPrevia: 'Preview',
    ocultarPrevia: 'Hide',
    avisoOrto: '{n} spelling corrections applied',
    avisoLint: '{n} things to review in the Excel',
    noGenerado: 'could not be generated',
    fuenteExcel: 'Manual Excel',
    errContacta: 'Check the Excel format; if the problem continues, email <a href="mailto:larry.beresforddiaz@mercadolibre.com.mx" style="color:#991B1B;font-weight:700;">Larry Beresford Díaz</a>.',
    kbOk: 'OK', kbPesado: 'too heavy for email'
  },
  pt: {
    hdrTitle: 'Gerador de Boletins',
    hdrSub: 'Newsletter mensal · Excelência Operacional · México',
    tabGenerar: 'Gerar', tabHistorial: 'Histórico',
    sectionUpload: 'Envie o Excel de cada área (mesmo modelo de sempre: Config / Proyectos / Secciones / Eventos / NuevosIngresos / KPIs)',
    sectionHistorial: 'Boletins gerados (persistem neste navegador)',
    excelDe: 'Excel de {area}',
    dzText: 'Arraste seu Excel aqui ou clique para escolher',
    kpiToggle: 'Resumo de projetos de {area} (opcional)',
    kpiTotal: 'Projetos (total calculado)',
    btnDefault: 'Gerar a partir dos Excel enviados',
    btnAll: 'Gerar os {n} boletins de uma vez',
    btnSome: 'Gerar {n} de {total} boletins enviados',
    emptyGenerar: 'Envie pelo menos um Excel para gerar seu boletim.',
    emptyHistorial: 'Você ainda não gerou nenhum boletim. Os que você gerar vão aparecer aqui para baixar de novo sem regenerar.',
    borrarHistorial: 'Limpar histórico',
    descargar: 'Baixar',
    vistaPrevia: 'Pré-visualizar',
    ocultarPrevia: 'Ocultar',
    avisoOrto: '{n} correções ortográficas aplicadas',
    avisoLint: '{n} coisas para revisar no Excel',
    noGenerado: 'não foi possível gerar',
    fuenteExcel: 'Excel manual',
    errContacta: 'Verifique o formato do Excel; se o problema continuar, escreva para <a href="mailto:larry.beresforddiaz@mercadolibre.com.mx" style="color:#991B1B;font-weight:700;">Larry Beresford Díaz</a>.',
    kbOk: 'OK', kbPesado: 'pesado para e-mail'
  }
};
function t(key, vars) {
  var s = (I18N[CURRENT_LANG] && I18N[CURRENT_LANG][key]) || I18N.es[key] || key;
  if (vars) Object.keys(vars).forEach(function (k) { s = s.replace('{' + k + '}', vars[k]); });
  return s;
}

// ---------------------------------------------------------------
// Config de áreas (idéntico a app.py de motor-oe-v2) + paleta por área
// (reutiliza los MISMOS acentos --tag-fm/--tag-svc/--tag-quality/--tag-mgmt
// que ya usa el Inicio del Hub, para que se sienta parte del mismo sitio)
// ---------------------------------------------------------------
var AREAS = ["FirstMile", "ServiceCenter", "Quality", "Management"];
var NOMBRE_LARGO = { FirstMile: "FM + XD + SC + TOM", ServiceCenter: "SVC + Last Mile", Quality: "Quality", Management: "Gestión" };
var NOMBRE_LARGO_EN = { FirstMile: "FM + XD + SC + TOM", ServiceCenter: "SVC + Last Mile", Quality: "Quality", Management: "Management" };
var NOMBRE_LARGO_PT = { FirstMile: "FM + XD + SC + TOM", ServiceCenter: "SVC + Last Mile", Quality: "Quality", Management: "Gestão" };
function nombreArea(area) {
  var d = CURRENT_LANG === 'en' ? NOMBRE_LARGO_EN : (CURRENT_LANG === 'pt' ? NOMBRE_LARGO_PT : NOMBRE_LARGO);
  return d[area];
}
var AREA_COLOR = {
  FirstMile: { ac: '#1E9E6B', bg: '#E9F8F0' },
  ServiceCenter: { ac: '#1E7FD1', bg: '#EAF3FC' },
  Quality: { ac: '#6C4FE0', bg: '#F1EDFB' },
  Management: { ac: '#E0602F', bg: '#FCEEE8' }
};
var AREA_ICON = {
  FirstMile: '<path d="M3 17V7a1 1 0 0 1 1-1h9v11"/><path d="M13 10h4l4 4v3h-2"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/><path d="M9 17h6"/>',
  ServiceCenter: '<path d="M21 8v8a1 1 0 0 1-.5.87l-8 4.5a1 1 0 0 1-1 0l-8-4.5A1 1 0 0 1 3 16V8a1 1 0 0 1 .5-.87l8-4.5a1 1 0 0 1 1 0l8 4.5A1 1 0 0 1 21 8Z"/><path d="M3.3 7.5 12 12.5l8.7-5"/><path d="M12 12.5V21.5"/>',
  Quality: '<path d="M12 2 4 5v6c0 5 3.4 8.7 8 10 4.6-1.3 8-5 8-10V5Z"/><path d="M9 12l2 2 4-4"/>',
  Management: '<path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/>'
};
function areaIconSvg(area) {
  return '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + AREA_ICON[area] + '</svg>';
}
var KPI_CAMPOS = {
  FirstMile: ["On going", "Despriorizado", "Cancelado", "Done"],
  ServiceCenter: ["On going", "Despriorizado", "Delayed", "Cancelado", "Done"]
};
var LIMITE_KB_EMAIL = 102.0;
var HIST_KEY = "oe_boletines_historial";
var HIST_MAX = 30;

var uploadedFiles = {}; // area -> File

function switchTab(id, btn) {
  document.querySelectorAll(".panel").forEach(function (p) { p.classList.remove("on"); });
  document.querySelectorAll(".tab").forEach(function (t) { t.classList.remove("on"); });
  document.getElementById("p-" + id).classList.add("on");
  btn.classList.add("on");
  if (id === "historial") renderHistorial();
}

// ---------------------------------------------------------------
// Construcción de las tarjetas de área
// ---------------------------------------------------------------
function buildAreaCards() {
  var cont = document.getElementById("areaCards");
  cont.innerHTML = "";
  AREAS.forEach(function (area) {
    var col = AREA_COLOR[area];
    var card = document.createElement("div");
    card.className = "area-card";
    card.style.setProperty('--ac', col.ac);
    card.style.setProperty('--ac-bg', col.bg);
    var kpiCampos = KPI_CAMPOS[area];
    var kpiToggleHtml = "", kpiBoxHtml = "";
    if (kpiCampos) {
      kpiToggleHtml = '<div class="kpi-toggle" id="kpiToggle_' + area + '" onclick="toggleKpi(\'' + area + '\')">'
        + '<span id="kpiToggleText_' + area + '">' + t('kpiToggle', { area: nombreArea(area) }) + '</span><span class="chev">&#9662;</span></div>';
      kpiBoxHtml = '<div class="kpi-box" id="kpiBox_' + area + '">'
        + '<div class="kpi-row">'
        + kpiCampos.map(function (c) {
          return '<div class="kpi-field"><label>' + c + '</label><input type="text" data-area="' + area + '" data-campo="' + c + '" oninput="actualizarTotalKpi(\'' + area + '\')"/></div>';
        }).join("")
        + '</div>'
        + '<div class="kpi-total" id="kpiTotalLabel_' + area + '">' + t('kpiTotal') + ': <b id="kpiTotal_' + area + '">0</b></div>'
        + '</div>';
    }
    card.innerHTML =
      '<div class="area-left">'
      + '<div class="area-icon">' + areaIconSvg(area) + '</div>'
      + '<div><div class="area-name" id="areaName_' + area + '">' + nombreArea(area) + '</div>'
      + '<div class="area-file" id="areaFile_' + area + '">' + t('excelDe', { area: nombreArea(area) }) + '</div></div>'
      + '</div>'
      + '<label class="dropzone area-mid" id="dz_' + area + '">'
      + '<input type="file" accept=".xlsx" onchange="onFileChange(\'' + area + '\', this)"/>'

      + '<div class="dz-text" id="dzText_' + area + '">' + t('dzText') + '</div>'
      + '</label>'
      + '<div class="area-right">' + kpiToggleHtml + '</div>'
      + kpiBoxHtml;
    cont.appendChild(card);
  });
}
function toggleKpi(area) {
  document.getElementById("kpiBox_" + area).classList.toggle("on");
  document.getElementById("kpiToggle_" + area).classList.toggle("open");
}
function actualizarTotalKpi(area) {
  var inputs = document.querySelectorAll('input[data-area="' + area + '"]');
  var total = 0;
  inputs.forEach(function (inp) {
    var v = parseInt((inp.value || "").trim(), 10);
    if (!isNaN(v)) total += v;
  });
  document.getElementById("kpiTotal_" + area).textContent = total;
}
function onFileChange(area, input) {
  uploadedFiles[area] = input.files && input.files[0] ? input.files[0] : null;
  var dz = document.getElementById("dz_" + area);
  var dzText = document.getElementById("dzText_" + area);
  if (uploadedFiles[area]) {
    dz.classList.add("has-file");
    dzText.textContent = uploadedFiles[area].name;
  } else {
    dz.classList.remove("has-file");
    dzText.textContent = t('dzText');
  }
  actualizarBotonGenerar();
}
function actualizarBotonGenerar() {
  var n = AREAS.filter(function (a) { return !!uploadedFiles[a]; }).length;
  var btn = document.getElementById("btnGenerar");
  if (n === AREAS.length) { btn.textContent = t('btnAll', { n: AREAS.length }); btn.className = "btn"; }
  else if (n > 0) { btn.textContent = t('btnSome', { n: n, total: AREAS.length }); btn.className = "btn secondary"; }
  else { btn.textContent = t('btnDefault'); btn.className = "btn secondary"; }
}

function kpisDesdeValores(area) {
  var campos = KPI_CAMPOS[area];
  if (!campos) return null;
  var numeros = {}, algun = false;
  campos.forEach(function (c) {
    var inp = document.querySelector('input[data-area="' + area + '"][data-campo="' + c + '"]');
    var texto = inp ? (inp.value || "").trim() : "";
    if (!texto) return;
    var v = parseInt(texto, 10);
    if (!isNaN(v)) { numeros[c] = v; algun = true; }
  });
  if (!algun) return null;
  var total = 0;
  Object.keys(numeros).forEach(function (k) { total += numeros[k]; });
  if (total <= 0) return null;
  var kpis = [["Proyectos", String(total)]];
  campos.forEach(function (c) { kpis.push([c, String(numeros[c] || 0)]); });
  return kpis;
}

fetch("data/boletines/directorio_oe.json").then(function (r) {

// ---------------------------------------------------------------
// Generación
// ---------------------------------------------------------------
function leerArrayBuffer(file) {
  return new Promise(function (resolve, reject) {
    var fr = new FileReader();
    fr.onload = function () { resolve(fr.result); };
    fr.onerror = reject;
    fr.readAsArrayBuffer(file);
  });
}

function kbBarHtml(kb) {
  var limite = LIMITE_KB_EMAIL;
  var frac = Math.max(0, Math.min(1, kb / limite));
  var color = kb < limite * 0.8 ? "#16a34a" : (kb <= limite ? "#f59e0b" : "#dc2626");
  var estado = kb <= limite ? t('kbOk') : t('kbPesado');
  return '<div class="kbbar-row"><span>' + kb.toFixed(1) + ' KB</span><span>' + estado + ' / ' + limite.toFixed(0) + ' KB</span></div>'
    + '<div class="kbbar"><div class="kbbar-fill" style="background:' + color + ';width:' + Math.round(frac * 100) + '%"></div></div>';
}

function avisosDetails(avisos, cls, label) {
  if (!avisos || !avisos.length) return "";
  var body = avisos.map(function (a) { return '<div>' + escapeHtml(a) + '</div>'; }).join("");
  return '<details class="' + cls + '"><summary>' + label + '</summary><div class="body">' + body + '</div></details>';
}
function escapeHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function registrarHistorial(item) {
  var hist = [];
  try { hist = JSON.parse(localStorage.getItem(HIST_KEY) || "[]"); } catch (e) { hist = []; }
  hist.unshift(item);
  if (hist.length > HIST_MAX) hist = hist.slice(0, HIST_MAX);
  try { localStorage.setItem(HIST_KEY, JSON.stringify(hist)); } catch (e) { console.warn("No se pudo guardar historial (localStorage lleno?):", e); }
}

function mostrarResultado(area, html, avisosLint, avisosOrto, nombreArchivo) {
  var kb = new Blob([html]).size / 1024;
  registrarHistorial({ area: area, fuente: t('fuenteExcel'), kb: kb, hora: new Date().toLocaleTimeString(), fecha: new Date().toLocaleDateString(), nombreArchivo: nombreArchivo, html: html });

  var col = AREA_COLOR[area];
  var cont = document.getElementById("resultados");
  var box = document.createElement("div");
  box.className = "result";
  box.style.setProperty('--ac', col.ac);
  box.style.setProperty('--ac-bg', col.bg);
  var previewId = "prev_" + area + "_" + Date.now();
  box.innerHTML =
    '<div class="result-h"><div class="result-badge">' + areaIconSvg(area) + '</div>'
    + '<div><div class="result-title">' + nombreArea(area) + '</div><div class="result-file">' + nombreArchivo + '</div></div></div>'
    + kbBarHtml(kb)
    + avisosDetails(avisosOrto, "aviso-orto", '&#9998; ' + t('avisoOrto', { n: avisosOrto.length }))
    + avisosDetails(avisosLint, "aviso-lint", '&#9888; ' + t('avisoLint', { n: avisosLint.length }))
    + '<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">'
    + '<button class="btn small" data-role="dl">' + t('descargar') + '</button>'
    + '<button class="btn small ghost" data-role="preview">' + t('vistaPrevia') + '</button>'
    + '</div>'
    + '<div class="preview-mock" id="mock_' + previewId + '" style="display:none">'
    + '<div class="preview-bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="url">' + nombreArchivo + '</span></div>'
    + '<iframe class="preview-frame" id="' + previewId + '"></iframe>'
    + '</div>';
  cont.prepend(box);

  var iframe = box.querySelector("#" + previewId);
  var mock = box.querySelector("#mock_" + previewId);
  box.querySelector('[data-role="dl"]').onclick = function () { descargarBlob(html, nombreArchivo); };
  box.querySelector('[data-role="preview"]').onclick = function (ev) {
    var showing = mock.style.display !== "none";
    if (showing) { mock.style.display = "none"; ev.target.textContent = t('vistaPrevia'); }
    else { mock.style.display = "block"; iframe.srcdoc = html; ev.target.textContent = t('ocultarPrevia'); }
  };
}

function descargarBlob(html, nombreArchivo) {
  var blob = new Blob([html], { type: "text/html" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = nombreArchivo;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
}

function generarTodos() {
  var cont = document.getElementById("resultados");
  cont.innerHTML = "";
  var alguno = false;
  var tareas = AREAS.map(function (area) {
    var file = uploadedFiles[area];
    if (!file) return Promise.resolve();
    alguno = true;
    return leerArrayBuffer(file).then(function (buf) {
      var wb = XLSX.read(new Uint8Array(buf), { type: "array" });
      var data = loadWorkbook(wb);
      var kpis = kpisDesdeValores(area);
      if (kpis) data.kpis = kpis;
      var avisosOrto = autocorregir(data);
      var html = build(data);
      var nombreArchivo = nombreArchivoBoletin(area, (data.config || {}).Mes);
      var avisosLint = lintData(data);
      mostrarResultado(area, html, avisosLint, avisosOrto, nombreArchivo);
    }).catch(function (err) {
      console.error(err);
      var box = document.createElement("div");
      box.className = "err-box";
      box.innerHTML = nombreArea(area) + ": " + t('noGenerado') + " (" + String(err.message).replace(/</g, "&lt;") + "). " + t('errContacta');
      cont.prepend(box);
    });
  });
  Promise.all(tareas).then(function () {
    if (!alguno) {
      cont.innerHTML = '<div class="empty-state"><div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5a1 1 0 0 1 1-1h9l6 6v9a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1Z"/><path d="M14 4v5a1 1 0 0 0 1 1h5"/></svg></div><div class="txt">' + t('emptyGenerar') + '</div></div>';
    }
  });
}

// ---------------------------------------------------------------
// Historial (localStorage, persiste entre visitas en este navegador)
// ---------------------------------------------------------------
function renderHistorial() {
  var cont = document.getElementById("historialList");
  var hist = [];
  try { hist = JSON.parse(localStorage.getItem(HIST_KEY) || "[]"); } catch (e) { hist = []; }
  if (!hist.length) {
    cont.innerHTML = '<div class="empty-state"><div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="9"/></svg></div><div class="txt">' + t('emptyHistorial') + '</div></div>';
    return;
  }
  cont.innerHTML = '<div style="margin-bottom:12px"><button class="btn ghost small" onclick="limpiarHistorial()">' + t('borrarHistorial') + '</button></div>'
    + hist.map(function (item, i) {
      var col = AREA_COLOR[item.area] || { ac: '#FFD001', bg: '#FFFBEA' };
      return '<div class="hist-row" style="--ac:' + col.ac + ';--ac-bg:' + col.bg + '">'
        + '<div class="hist-badge">' + areaIconSvg(item.area) + '</div>'
        + '<div class="hist-info"><b>' + nombreArea(item.area) + '</b><br>' + item.fuente + ' · ' + item.kb.toFixed(1) + ' KB · ' + item.fecha + ' ' + item.hora + '</div>'
        + '<div class="hist-actions"><button class="btn small" onclick="descargarHistorial(' + i + ')">' + t('descargar') + '</button></div></div>';
    }).join("");
}
function descargarHistorial(i) {
  var hist = [];
  try { hist = JSON.parse(localStorage.getItem(HIST_KEY) || "[]"); } catch (e) { hist = []; }
  var item = hist[i];
  if (!item) return;
  descargarBlob(item.html, item.nombreArchivo || ("Boletin_" + item.area + ".html"));
}
function limpiarHistorial() {
  localStorage.removeItem(HIST_KEY);
  renderHistorial();
}

// ---------------------------------------------------------------
// Aplicar idioma (mensaje del Hub) -- sin perder los archivos ya
// seleccionados ni los valores de KPI ya tecleados: solo reconstruye
// las tarjetas de área si el usuario todavia no subió nada.
// ---------------------------------------------------------------
function applyLang(lang) {
  if (!I18N[lang]) return;
  CURRENT_LANG = lang;
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(function (el) {
    var key = el.getAttribute('data-i18n');
    if (I18N[lang][key]) el.textContent = I18N[lang][key];
  });
  var hayArchivos = AREAS.some(function (a) { return !!uploadedFiles[a]; });
  if (!hayArchivos) {
    buildAreaCards();
  } else {
    AREAS.forEach(function (area) {
      var elName = document.getElementById('areaName_' + area);
      var elFile = document.getElementById('areaFile_' + area);
      var elToggle = document.getElementById('kpiToggleText_' + area);
      var elTotalLbl = document.getElementById('kpiTotalLabel_' + area);
      if (elName) elName.textContent = nombreArea(area);
      if (elFile) elFile.textContent = t('excelDe', { area: nombreArea(area) });
      if (elToggle) elToggle.textContent = t('kpiToggle', { area: nombreArea(area) });
      if (elTotalLbl) { var b = elTotalLbl.querySelector('b'); elTotalLbl.innerHTML = t('kpiTotal') + ': '; if (b) elTotalLbl.appendChild(b); }
      if (!uploadedFiles[area]) {
        var dzText = document.getElementById('dzText_' + area);
        if (dzText) dzText.textContent = t('dzText');
      }
    });
  }
  actualizarBotonGenerar();
  if (document.getElementById('p-historial').classList.contains('on')) renderHistorial();
}
window.addEventListener('message', function (e) {
  if (e && e.data && e.data.type === 'oeHubLang') applyLang(e.data.lang);
});

buildAreaCards();
</script>

<!-- ══ MOTOR (puerto de motor.py) ══ -->
<script>
// motor.js -- puerto 1:1 de motor-oe-v2/motor.py (sin PIL/OpenCV: las fotos
// remotas -- imgur/Drive, que es el 100% del uso real hoy -- se manejan
// exactamente igual que en Python (link reescrito, sin descargar). Las fotos
// LOCALES con recorte de cara (poco usadas, ver README) no se pueden procesar
// en el navegador -- en su lugar se muestra un aviso visible en vez de fallar
// en silencio, ver imgHtml()/photo().
var YEL = "#FFE600";

function esc(s) { return (s === null || s === undefined) ? "" : String(s).trim(); }
function parts(s, sep) {
  return String(s || "").split(sep).map(function (t) { return t.trim(); }).filter(Boolean);
}
function toAscii(s) {
  var out = "";
  for (var i = 0; i < s.length; i++) {
    var cp = s.codePointAt(i);
    if (cp > 0xFFFF) i++; // saltar la mitad baja de un par subrogado
    out += cp > 127 ? ("&#" + cp + ";") : s[i];
  }
  return out;
}

function drive(u, sz) {
  sz = sz || "w1600";
  u = esc(u);
  if (u.indexOf("drive.google.com") === -1) return u;
  var m = u.match(/(?:\/d\/|\/file\/d\/|[?&]id=)([A-Za-z0-9_-]{20,})/);
  return m ? ("https://drive.google.com/thumbnail?id=" + m[1] + "&sz=" + sz) : u;
}

var MES = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
function mesSplit(m) {
  var p = esc(m).split(/\s+/).filter(Boolean);
  var nm = p[0] || "";
  var yr = p.find(function (x) { return /^\d+$/.test(x); }) || "";
  return [nm ? nm.slice(0, 3) : "", yr];
}
function mesNombreCompleto(m) {
  var p = esc(m).split(/\s+/).filter(Boolean);
  if (!p.length) return "";
  var w = p[0];
  return w.charAt(0).toUpperCase() + w.slice(1).toLowerCase();
}

var NOMBRE_ARCHIVO_AREA = {
  "FirstMile": "FM+XD+SC+TOM",
  "ServiceCenter": "SVC+Last Mile",
  "Quality": "Quality",
  "Management": "Gestion",
  "FM + XD + SC + TOM": "FM+XD+SC+TOM",
  "SVC + Last Mile": "SVC+Last Mile"
};
function nombreArchivoBoletin(areaKey, mesCfg) {
  var nombreArea = NOMBRE_ARCHIVO_AREA[areaKey];
  if (nombreArea === undefined) nombreArea = String(areaKey).replace(/\s*\+\s*/g, "+");
  var mes = mesNombreCompleto(mesCfg);
  return mes ? ("Boletin_" + nombreArea + "_" + mes + ".html") : ("Boletin_" + nombreArea + ".html");
}

var PILL = {
  "on track": ["#f0fdf4", "#16a34a"], "en proceso": ["#fffbeb", "#d97706"], "planeado": ["#eff6ff", "#111111"],
  "en riesgo": ["#fef2f2", "#dc2626"], "discovery": ["#f1f5f9", "#64748b"], "en revision": ["#eff6ff", "#1e5ba8"],
  "bloqueado": ["#fef2f2", "#dc2626"], "implementado": ["#f0fdf4", "#16a34a"]
};

function imgHtml(url, label, link) {
  var v = esc(url);
  if (!v) return "";
  var s;
  if (v.indexOf("http") === 0) {
    var u = drive(v);
    if (!u) return "";
    s = '<img src="' + u + '" alt="" style="max-width:100%;height:auto;display:block;margin:12px auto;border-radius:6px;border:0"/>';
  } else {
    // Imagen LOCAL referenciada por nombre de archivo -- no soportado en el
    // navegador (requeriría acceso a fotos/ del repo motor-oe-v2). En vez de
    // fallar en silencio, se deja visible el aviso en el boletín mismo.
    return '<div style="font:italic 400 11px/1.5 Arial,sans-serif;color:#d97706;text-align:center;margin:12px 0">[Imagen local "' + v + '" no soportada aquí -- sube la imagen a Imgur/Drive y usa ese link en ImagenURL.]</div>';
  }
  var lk = esc(link);
  if (lk) s = '<a href="' + lk + '" target="_blank" style="text-decoration:none">' + s + '</a>';
  if (esc(label)) s += '<div style="font:italic 400 10.5px/1.45 Arial,sans-serif;color:#888;text-align:center;margin:4px 0 12px">' + esc(label) + '</div>';
  return s;
}

function photo(v) {
  v = esc(v);
  if (!v) return "";
  return v.indexOf("http") === 0 ? drive(v, "w400") : ""; // local no soportado -> cae al circulo gris, igual que sin foto
}
function avatar(url, size) {
  size = size || 46;
  var u = photo(url);
  return u
    ? '<img src="' + u + '" alt="" width="' + size + '" height="' + size + '" style="width:' + size + 'px;height:' + size + 'px;border-radius:50%;object-fit:cover;border:2px solid ' + YEL + ';display:block;margin:0 auto"/>'
    : '<div style="width:' + size + 'px;height:' + size + 'px;border-radius:50%;background:#e5e7eb;margin:0 auto"></div>';
}

function _enlacesNota(d) {
  var g = function (k) { return esc(d[k]); };
  var P = [];
  parts(d.Enlaces, "|").forEach(function (e) {
    var idx = e.indexOf("="), nm, u;
    if (idx === -1) { u = e; nm = ""; } else { nm = e.slice(0, idx); u = e.slice(idx + 1); }
    if (!u.trim()) { u = nm; nm = "Ver mas"; }
    P.push('<a href="' + (u.trim() || "#") + '" target="_blank" style="display:inline-block;background:' + YEL + ';color:#111;font:800 10px/1 Arial,sans-serif;padding:9px 16px;border-radius:6px;text-decoration:none;text-transform:uppercase;letter-spacing:.6px;margin:4px 6px 4px 0">' + nm.trim() + '</a>');
  });
  if (g("Nota")) P.push('<div style="font:italic 400 11px/1.5 Arial,sans-serif;color:#888;margin-top:10px">' + g("Nota") + '</div>');
  return P.join("");
}

function _partition(s, sep) {
  var idx = s.indexOf(sep);
  return idx === -1 ? [s, "", ""] : [s.slice(0, idx), sep, s.slice(idx + sep.length)];
}

function diagnosticoAperturasCard(d) {
  var g = function (k) { return esc(d[k]); };
  var tp = g("Titulo").split("::").map(function (t) { return t.trim(); });
  var num = tp[0] || "", desc = tp.length > 1 ? tp[1] : (tp.length === 1 ? tp[0] : ""), meta = tp.length > 2 ? tp[2] : "";
  var pat = /antes\s+(.+?)\s*(?:->|-&gt;|→)\s*ahora\s+(.+)/i;
  var datePat = /\(([^)]+)\)\s*$/;
  var filas = [], sueltos = [];
  parts(d.Hitos, "||").forEach(function (hh) {
    var p = _partition(hh, "::"); var t = p[0].trim(), x = p[2].trim();
    var m = pat.exec(x);
    if (!m) { sueltos.push([t, x]); return; }
    var antes = m[1].trim(), ahora = m[2].trim();
    var dm = datePat.exec(ahora);
    var fecha = dm ? dm[1].trim() : "";
    if (dm) ahora = ahora.replace(datePat, "").trim();
    filas.push([t, fecha, antes, ahora]);
  });
  var P = ['<div style="border:1px solid #ececec;border-radius:12px;overflow:hidden;margin-bottom:16px">'];
  P.push('<div style="background:#111;padding:20px 22px">');
  if (g("Tag")) P.push('<div style="font:800 9px/1 Arial,sans-serif;letter-spacing:2px;text-transform:uppercase;color:' + YEL + ';margin-bottom:12px">' + g("Tag") + '</div>');
  P.push('<table cellpadding="0" cellspacing="0" role="presentation"><tr>');
  if (num) P.push('<td style="font:900 46px/1 Arial,sans-serif;color:' + YEL + ';padding-right:14px;vertical-align:top">' + num + '</td>');
  if (desc) P.push('<td style="font:700 16px/1.35 Arial,sans-serif;color:#fff;vertical-align:top;padding-top:4px">' + desc + '</td>');
  P.push('</tr></table>');
  if (meta) P.push('<div style="font:600 11px/1 Arial,sans-serif;color:#999;margin-top:12px">' + meta + '</div>');
  P.push('</div>');
  P.push('<div style="background:#fff;padding:18px 22px">');
  if (g("Texto")) P.push('<div style="font:400 12.5px/1.6 Arial,sans-serif;color:#333;margin-bottom:14px">' + g("Texto") + '</div>');
  filas.forEach(function (f, i) {
    var t = f[0], fecha = f[1], antes = f[2], ahora = f[3];
    var top = i > 0 ? "border-top:1px solid #f0f0f0;" : "";
    var fechaTd = fecha ? '<span style="display:inline-block;font:700 10px/1 Arial,sans-serif;color:#777;border:1px solid #ddd;border-radius:4px;padding:5px 8px;white-space:nowrap">' + fecha + '</span>' : "";
    P.push('<table width="100%" cellpadding="0" cellspacing="0" style="' + top + 'padding:12px 0"><tr>'

    + '<tr><td style="padding:8px;text-align:center">' + avatar(d.foto, 34)
    + '<div style="font:800 11px/1.25 Arial,sans-serif;color:#111;margin-top:5px">' + esc(d.n) + '</div>'
    + '<div style="font:700 8.5px/1.3 Arial,sans-serif;color:#888;text-transform:uppercase;letter-spacing:.3px">' + niv + '</div>'
    + mail + '</td></tr></table>';
}
function _cboxSmGhost() {
  // Espaciador invisible con la misma altura que una tarjeta real, para alinear
  // por nivel jerárquico las ramas que no tienen Manager (Quality, Gestión) un
  // escalón abajo de las que sí lo tienen (SVC+Last Mile, FM+XD+SC+TOM).
  return '<div style="visibility:hidden">' + _cboxSm({ n: " ", niv: " ", mail: "", foto: "" }) + '</div>';
}
function directorioOrg() {
  var sr = DIRECTORIO_OE.filter(function (d) { return d.niv === "Sr Manager"; });
  var rest = DIRECTORIO_OE.filter(function (d) { return d.niv !== "Sr Manager"; });
  var out = ['<div style="text-align:center;font:700 9px/1 Arial,sans-serif;color:#888;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:10px">Directorio</div>'];
  if (sr.length) out.push('<table cellpadding="0" cellspacing="0" align="center" style="margin:0 auto"><tr><td width="330" style="padding:6px;vertical-align:top">' + _cbox(sr[0]) + '</td></tr></table>');
  if (rest.length) {
    out.push(_conn());
    var order = [], groups = {};
    rest.forEach(function (d) {
      var k = esc(d.rama) || esc(d.area) || "Equipo";
      groups[k] = groups[k] || [];
      groups[k].push(d);
      if (order.indexOf(k) === -1) order.push(k);
    });
    var n = order.length || 1;
    var cellw = 100.0 / n;
    var cols = order.map(function (k) {
      var tieneManager = groups[k].some(function (d) { return d.niv === "Manager"; });
      var ghost = tieneManager ? "" : _cboxSmGhost();
      return '<td width="' + cellw.toFixed(2) + '%" style="padding:0 4px;vertical-align:top">'
        + '<div style="font:800 9.5px/1 Arial,sans-serif;color:#888;text-align:center;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">' + k + '</div>'
        + ghost + groups[k].map(_cboxSm).join("") + '</td>';
    }).join("");
    out.push('<table cellpadding="0" cellspacing="0" width="100%" style="table-layout:fixed;border-collapse:collapse"><tr>' + cols + '</tr></table>');
  }
  return out.join("");
}

function build(data) {
  var cfg = data.config || {};
  var inner = [cover(cfg), introHtml(cfg.Intro)];
  if (data.kpis && data.kpis.length) {
    var areaKpi = esc(cfg.Area) || String(esc(cfg.TituloPortada)).split("+")[0].trim();
    inner.push(resumenBandSimple(data.kpis, "Resumen de Proyectos de " + areaKpi));
  }
  var n = 0;
  if (data.proyectos && data.proyectos.length) { n++; inner.push(sec(n, "Oficina de Proyectos", projTable(data.proyectos))); }
  var order = [], groups = {};
  (data.secciones || []).forEach(function (d) {
    var k = esc(d.Seccion) || "Seccion";
    groups[k] = groups[k] || [];
    groups[k].push(d);
    if (order.indexOf(k) === -1) order.push(k);
  });
  order.forEach(function (k) {
    n++; inner.push(sec(n, k, groups[k].map(card).join("")));
  });
  if (data.eventos && data.eventos.length) { n++; inner.push(sec(n, "Eventos en Puerta", events(data.eventos))); }
  if (data.nuevos && data.nuevos.length) { n++; inner.push(sec(n, "Nuevos Ingresos al Equipo", nuevos(data.nuevos))); }
  n++; inner.push(sec(n, "Directorio - Equipo OE", directorioOrg()));
  inner.push(footerHtml(cfg));
  return toAscii(doc(cfg, inner.join("")));
}

// ---- lectura de Excel (SheetJS) ----
function sheetToRows(ws) {
  if (!ws) return [];
  var rows = XLSX.utils.sheet_to_json(ws, { defval: null });
  return rows.filter(function (r) {
    return Object.keys(r).some(function (k) { return r[k] !== null && r[k] !== ""; });
  });
}
function readConfig(ws) {
  if (!ws) return {};
  var rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null });
  var cfg = {};
  for (var i = 1; i < rows.length; i++) {
    var r = rows[i];
    if (r && r[0] !== null && r[0] !== undefined && r[0] !== "") cfg[r[0]] = r[1];
  }
  return cfg;
}
function loadWorkbook(wb) {
  var data = {};
  data.config = wb.SheetNames.indexOf("Config") !== -1 ? readConfig(wb.Sheets["Config"]) : {};
  [["Proyectos", "proyectos"], ["Secciones", "secciones"], ["Eventos", "eventos"], ["NuevosIngresos", "nuevos"], ["Directorio", "directorio"]].forEach(function (pair) {
    var sh = pair[0], key = pair[1];
    if (wb.SheetNames.indexOf(sh) !== -1) data[key] = sheetToRows(wb.Sheets[sh]);
  });
  if (wb.SheetNames.indexOf("KPIs") !== -1) {
    var kpRows = sheetToRows(wb.Sheets["KPIs"]);
    var kp = kpRows.map(function (d) { return [esc(d.Etiqueta), esc(d.Valor)]; }).filter(function (pair) { return pair[1]; });
    if (kp.length) data.kpis = kp;
  }
  return data;
}

// ---- lint (avisos de revisión, no bloquean nada) ----
var _HOSTS_FOTO_OK = ["imgur.com", "drive.google.com", "googleusercontent.com"];
function _fotoAviso(url) {
  var u = esc(url);
  if (!u) return null;
  if (u.indexOf("http") !== 0) return 'no empieza con "http" -- probablemente no es un link valido, va a salir en blanco.';
  if (!_HOSTS_FOTO_OK.some(function (h) { return u.indexOf(h) !== -1; })) return 'no parece ser un link de imgur ni de Google Drive -- revisar que sea el link DIRECTO a la imagen (no a un album/carpeta), o puede salir en blanco.';
  return null;
}
function lintData(data) {
  var avisos = [];
  (data.proyectos || []).forEach(function (d) {
    var proy = esc(d.Proyecto) || "(sin nombre)";
    var enl = esc(d.Enlace);
    if (!enl || enl === "-") {
      avisos.push('Proyecto "' + proy + '": no tiene Enlace -- el titulo va a salir sin link clicable.');
    } else if ((enl.match(/http/g) || []).length > 1 || enl.indexOf("http") !== 0) {
      avisos.push('Proyecto "' + proy + '": el Enlace no es una URL unica y limpia (trae texto/etiqueta o mas de un link pegado) -- el titulo va a salir con link roto: ' + enl.slice(0, 80));
    }
  });
  (data.secciones || []).forEach(function (d) {
    var titulo = esc(d.Titulo) || "(sin titulo)";
    parts(d.Enlaces, "|").forEach(function (e) {
      var idx = e.indexOf("="), nm, u;
      if (idx === -1) { avisos.push('"' + titulo + '": un Enlace no trae el formato "Etiqueta=URL" (se muestra con etiqueta generica "Ver mas") -- revisar: ' + e.slice(0, 60)); return; }
      nm = e.slice(0, idx); u = e.slice(idx + 1);
      if (nm.indexOf("http") !== -1 && u.trim().indexOf("http") !== 0) {
        avisos.push('"' + titulo + '": un Enlace trae un "=" de query-string sin Etiqueta explicita -- el partition corta la URL y el link sale roto: ' + e.slice(0, 80));
      }
    });
    parts(d.Metricas, "|").forEach(function (it) {
      if (it.indexOf("=") === -1) avisos.push('"' + titulo + '": una Metrica no trae el formato "Etiqueta=Valor" (se movio a bullet) -- revisar: ' + it.slice(0, 60));
    });
    parts(d.Hitos, "||").forEach(function (hh) {
      if (hh.indexOf("::") === -1) avisos.push('"' + titulo + '": un Hito no trae el formato "Titulo::Detalle" (se muestra sin detalle) -- revisar: ' + hh.slice(0, 60));
    });
    var u = esc(d.ImagenURL);
    if (u) { var av = _fotoAviso(u); if (av) avisos.push('"' + titulo + '": la ImagenURL ' + av); }
  });
  (data.nuevos || []).forEach(function (d) {
    var nom = esc(d.Nombre) || "(sin nombre)";
    var u = esc(d.FotoURL);
    if (u) { var av = _fotoAviso(u); if (av) avisos.push('Nuevo ingreso "' + nom + '": la FotoURL ' + av); }
  });
  DIRECTORIO_OE.forEach(function (d) {
    var u = esc(d.foto), nom = esc(d.n) || "(sin nombre)";
    if (!u) avisos.push('Directorio: "' + nom + '" no tiene foto configurada en directorio_oe.json.');
    else { var av = _fotoAviso(u); if (av) avisos.push('Directorio: la foto de "' + nom + '" ' + av); }
  });
  return avisos;
}

if (typeof module !== "undefined") {
  module.exports = {
    esc: esc, parts: parts, toAscii: toAscii, drive: drive, mesSplit: mesSplit, mesNombreCompleto: mesNombreCompleto,
    nombreArchivoBoletin: nombreArchivoBoletin, NOMBRE_ARCHIVO_AREA: NOMBRE_ARCHIVO_AREA,
    imgHtml: imgHtml, avatar: avatar, card: card, projRow: projRow, projTable: projTable, events: events,
    nuevos: nuevos, resumenBandSimple: resumenBandSimple, cover: cover, introHtml: introHtml, sec: sec,
    footerHtml: footerHtml, doc: doc, build: build, loadWorkbook: loadWorkbook, lintData: lintData,
    cargarDirectorio: cargarDirectorio, DIRECTORIO_OE: DIRECTORIO_OE
  };
}

<script>
// corrector.js -- puerto 1:1 de motor-oe-v2/corrector.py

var SIGLAS_WHITELIST = new Set([
  "SVC", "KPI", "KPIs", "NC", "NCs", "SHE", "OE", "FM", "XD", "LM", "LH", "Air",
  "PEL", "PEX", "PEFM", "PELH", "PELM", "PEMAIR", "PET",
  "MLM", "MLA", "MLB", "MLC", "MCO", "MPE", "LATAM",
  "GGP", "LMS", "OPS", "SCC1", "SCH1", "SLP1", "STR1", "XEM3",
  "Q1", "Q2", "Q3", "Q4", "IDs", "ID", "PBP", "BIW", "WBR", "CTQ",
  "Sherlock", "Grid", "Gemba", "Moki"
]);

var REEMPLAZOS_PALABRA = {
  "mas": "más", "asi": "así", "mexico": "méxico", "america": "américa",
  "numero": "número", "operacion": "operación", "gestion": "gestión",
  "auditoria": "auditoría", "auditorias": "auditorías", "criticas": "críticas",
  "critico": "crítico", "solido": "sólido", "practicamente": "prácticamente",
  "rapido": "rápido", "facil": "fácil",
  "carntidad": "cantidad", "desemepeño": "desempeño", "cumplimieto": "cumplimiento",
  "duranre": "durante", "prgramas": "programas", "resultad0": "resultado",
  "vezen": "vez en"
};

var REEMPLAZOS_FRASE = {
  "se logro": "se logró", "se activo": "se activó", "cumplio al": "cumplió al",
  "cumplio con": "cumplió con", "se iniciara": "se iniciará", "de reconoce": "se reconoce",
  "re revisadon": "se revisaron", "todos el equipo": "todo el equipo",
  "ejecute las procesos": "ejecute los procesos", "se realizaron kick off": "se realizó un kick off"
};

function _escapeRegExp(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
if (typeof esc === "undefined") { var esc = function (s) { return (s === null || s === undefined) ? "" : String(s).trim(); }; }

function _isUpperPy(s) {
  var hasCased = false, allUpper = true;
  for (var i = 0; i < s.length; i++) {
    var ch = s[i], lower = ch.toLowerCase(), upper = ch.toUpperCase();
    if (lower !== upper) {
      hasCased = true;
      if (ch !== upper) { allUpper = false; break; }
    }
  }
  return hasCased && allUpper;
}
function _isFirstUpperPy(s) {
  if (!s.length) return false;
  var c = s[0];
  return c === c.toUpperCase() && c !== c.toLowerCase();
}
function _preservarMayus(original, nuevo) {
  if (_isUpperPy(original)) return nuevo.toUpperCase();
  if (_isFirstUpperPy(original)) return nuevo.slice(0, 1).toUpperCase() + nuevo.slice(1);
  return nuevo;
}

function _limpiarEspaciosYPuntuacion(s) {
  var cambios = [];
  var nuevo = s.replace(/ {2,}/g, " ");
  if (nuevo !== s) cambios.push("espacios dobles -> uno solo");
  s = nuevo;
  nuevo = s.replace(/,(\s*)$/, "$1");
  if (nuevo !== s) cambios.push("coma suelta al final removida");
  s = nuevo;
  return [s, cambios];
}

function corregirTexto(texto) {
  if (!texto) return [texto, []];
  var s = String(texto);
  var stripped = s.trim();
  if (stripped.indexOf("http") === 0 || (s.indexOf("@") !== -1 && stripped.indexOf(" ") === -1)) {
    return [texto, []];
  }
  var cambios = [];

  Object.keys(REEMPLAZOS_FRASE).forEach(function (mal) {
    var bien = REEMPLAZOS_FRASE[mal];
    var pat = new RegExp(_escapeRegExp(mal), "gi");
    var hit = false;
    var nuevo = s.replace(pat, function (m) { hit = true; return _preservarMayus(m, bien); });
    if (hit) { cambios.push('"' + mal + '" -> "' + bien + '"'); s = nuevo; }
  });

  s = s.replace(/[A-Za-zÁÉÍÓÚáéíóúñÑ0-9]+/g, function (palabra) {
    if (SIGLAS_WHITELIST.has(palabra) || _isUpperPy(palabra)) return palabra;
    var clave = palabra.toLowerCase();
    if (Object.prototype.hasOwnProperty.call(REEMPLAZOS_PALABRA, clave)) {
      var nueva = _preservarMayus(palabra, REEMPLAZOS_PALABRA[clave]);
      if (nueva !== palabra) cambios.push('"' + palabra + '" -> "' + nueva + '"');
      return nueva;
    }
    return palabra;
  });

  var r = _limpiarEspaciosYPuntuacion(s);
  s = r[0];
  cambios = cambios.concat(r[1]);

  return [s, cambios];
}

var CAMPOS_SECCIONES = ["Tag", "Titulo", "Texto", "Hitos", "Bullets", "ProximosPasos", "ImagenLabel", "Nota"];
var CAMPOS_PROYECTOS = ["Resumen", "Contexto", "Stopper", "Siguiente"];

function autocorregir(data) {
  var avisos = [];
  function campo(d, campoNombre, contexto) {
    var val = d[campoNombre];
    if (!val || typeof val !== "string") return;
    var r = corregirTexto(val);
    var nuevo = r[0], cambios = r[1];
    if (cambios.length) {
      d[campoNombre] = nuevo;
      avisos.push(contexto + " (" + campoNombre + "): " + cambios.join(", "));
    }
  }
  var cfg = data.config || {};
  ["Resumen", "TituloPortada"].forEach(function (c) { campo(cfg, c, "Config"); });
  (data.proyectos || []).forEach(function (d) {
    var nombre = (esc(d.Proyecto) || "(sin nombre)").trim();
    CAMPOS_PROYECTOS.forEach(function (c) { campo(d, c, 'Proyecto "' + nombre + '"'); });
  });
  (data.secciones || []).forEach(function (d) {
    var titulo = (esc(d.Titulo) || "(sin titulo)").trim();
    CAMPOS_SECCIONES.forEach(function (c) { campo(d, c, '"' + titulo + '"'); });
  });
  return avisos;
}

if (typeof module !== "undefined") {
  module.exports = { corregirTexto: corregirTexto, autocorregir: autocorregir, SIGLAS_WHITELIST: SIGLAS_WHITELIST, REEMPLAZOS_PALABRA: REEMPLAZOS_PALABRA, REEMPLAZOS_FRASE: REEMPLAZOS_FRASE };
}
